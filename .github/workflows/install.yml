name: Release installation
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Published release or candidate download URL
        required: true
        default: https://github.com/KarmenLoop/karmenbot/releases/latest/download
permissions:
  contents: read
jobs:
  install:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify native installation and file tools
        run: node scripts/verify-install.mjs --base-url "$KARMENBOT_ACCEPTANCE_URL" --output installation.json
        shell: bash
        env:
          KARMENBOT_ACCEPTANCE_URL: ${{ inputs.base_url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installation-${{ matrix.os }}
          path: installation.json
